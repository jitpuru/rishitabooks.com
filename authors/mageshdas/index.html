<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1B2A44">
<title>Magesh | Rishita Books</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rishita Books">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="icon" type="image/png" href="../icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;1,400&family=Hind:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--band:#1B2A44;--ink:#F6F3EC;--ink2:rgba(246,243,236,.76);--muted:rgba(246,243,236,.56);--gold:#D8B978}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;min-height:100%;display:flex;align-items:center;justify-content:center;background:var(--band);color:var(--ink);
 font:17px/1.7 "Hind",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;
 padding:env(safe-area-inset-top,0px) 1.5rem env(safe-area-inset-bottom,0px)}
main{max-width:26rem;text-align:center}
img{width:112px;height:auto;border-radius:22%}
h1{font:400 clamp(1.8rem,7vw,2.3rem)/1.2 "Libre Baskerville",Georgia,serif;margin:1.4rem 0 .6rem;letter-spacing:-.005em}
h1 em{font-style:italic;color:var(--gold)}
p{color:var(--ink2);margin:.5rem 0}
a.btn{display:inline-block;margin-top:1.6rem;padding:1.05rem 2.3rem;background:var(--gold);color:var(--band);border:1px solid var(--gold);
 font:400 .72rem/1 "Hind",Helvetica,Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;transition:background .3s,color .3s}
a.btn:hover{background:transparent;color:var(--gold)}
a.btn:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
.tip{margin-top:1.6rem;font-size:.85rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){a.btn{transition:none}}
</style>
</head>
<body>
<main>
 <img src="../icon-512.png" alt="Rishita Books">
 <h1 id="h">Hi <em>Magesh</em></h1>
 <p id="msg">Here’s how Winning by Design is doing: your sales and royalties, all in one place.</p>
 <a class="btn" id="go" href="#">Open my dashboard</a>
 <p class="tip" id="tip">On iPhone, tap Share, then Add to Home Screen, to keep this one tap away.</p>
</main>
<script>
const APP='https://script.google.com/macros/s/AKfycbwJU88S8Jl7MzH169GpHPm6tb3mbZQxD_BL5syTDCwT-6DHr9wxk7SEqghntKSIQV0Uhw/exec';
const key=decodeURIComponent(location.hash.slice(1)).trim();
const go=document.getElementById('go');
if(!/^[A-Za-z0-9_-]{16,}$/.test(key)){
  document.getElementById('h').textContent='This link is incomplete';
  document.getElementById('msg').textContent='Please use the full link Jit sent you, or message Jit for a fresh one.';
  go.remove();document.getElementById('tip').remove();
}else{
  const url=APP+'?k='+encodeURIComponent(key);
  go.href=url;
  if(window.navigator.standalone===true||matchMedia('(display-mode: standalone)').matches){location.replace(url)}
  else if(!/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)){document.getElementById('tip').textContent='Bookmark this page to come back to it.'}
}
</script>
</body>
</html>
